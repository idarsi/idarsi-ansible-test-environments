name: Reusable Idarsi Molecule test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      test_environment_ref:
        required: false
        default: main
        type: string
      role_repository:
        required: false
        default: ""
        type: string
      role_ref:
        required: false
        default: ""
        type: string
      molecule_args:
        required: false
        default: test
        type: string
      allow_failure:
        required: false
        default: false
        type: boolean

jobs:
  molecule:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow_failure }}
    steps:
      - name: Check out role
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.role_repository || github.repository }}
          ref: ${{ inputs.role_ref || github.sha }}
          path: role
      - name: Check out test environment
        uses: actions/checkout@v4
        with:
          repository: idarsi/idarsi-ansible-test-environments
          ref: ${{ inputs.test_environment_ref }}
          path: test-environment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Builder
        run: python -m pip install --disable-pip-version-check ansible-builder==3.1.1
      - name: Build controller image
        working-directory: test-environment
        env:
          IMAGE: localhost/idarsi/ansible-test:${{ inputs.environment }}
        run: scripts/build "${{ inputs.environment }}"
      - name: Start Podman API
        run: |
          podman system service --time=0 unix:///tmp/idarsi-podman.sock >/tmp/podman-service.log 2>&1 &
          for attempt in $(seq 1 30); do test -S /tmp/idarsi-podman.sock && break; sleep 1; done
          test -S /tmp/idarsi-podman.sock
      - name: Run role Molecule scenario
        working-directory: test-environment
        env:
          IMAGE: localhost/idarsi/ansible-test:${{ inputs.environment }}
          CONTAINER_HOST: /tmp/idarsi-podman.sock
        run: scripts/test "${{ inputs.environment }}" "$GITHUB_WORKSPACE/role" -- ${{ inputs.molecule_args }}
