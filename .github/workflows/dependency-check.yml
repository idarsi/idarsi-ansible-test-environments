name: Dependency and definition checks

on:
  pull_request:
    paths:
      - "versions.yml"
      - "environments/**"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ansible-builder==3.1.1 yamllint
      - name: Validate YAML style
        run: yamllint .
      - name: Render all definitions
        run: make validate
      - name: Verify source pin is synchronized
        run: |
          test "$(awk '/min:/{gsub(/[\"]/, "", $2); print $2}' versions.yml)" = "$(awk -F'==' '/ansible-core/{print $2}' environments/ansible-min/execution-environment.yml)"
          test "$(awk '/current:/{gsub(/[\"]/, "", $2); print $2}' versions.yml)" = "$(awk -F'==' '/ansible-core/{print $2}' environments/ansible-current/execution-environment.yml)"
          test "$(awk '/next:/{gsub(/[\"]/, "", $2); print $2}' versions.yml)" = "$(awk -F'==' '/ansible-core/{print $2}' environments/ansible-next/execution-environment.yml)"
