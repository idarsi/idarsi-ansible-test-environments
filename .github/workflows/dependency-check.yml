name: Dependency and definition checks

on:
  pull_request:
    paths:
      - "versions.yml"
      - "environments/**"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check "ansible-builder==$(awk -F'\"' '/^ansible_builder:/{print $2}' versions.yml)" yamllint
      - name: Validate YAML style
        run: yamllint .
      - name: Render all definitions
        run: make validate
      - name: Verify source pin is synchronized
        run: scripts/check-dependencies
