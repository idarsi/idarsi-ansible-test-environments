name: Repository checks

on:
  pull_request:
    paths:
      - "versions.yml"
      - "environments/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - "install.sh"
      - "uninstall.sh"
      - "config/**"
      - "verify-install*.sh"
      - "examples/molecule-kvm/**"
      - "molecule/**"
      - "examples/molecule-managed-*/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML linter
        run: python -m pip install --disable-pip-version-check yamllint
      - name: Validate YAML style
        run: yamllint .
      - name: Validate scripts and dependency pins
        run: make check-scripts check-dependencies
      - name: Install pinned Molecule for effective configuration checks
        run: |
          MOLECULE_PIN=$(grep '^molecule==' environments/ansible-current/requirements.txt)
          python -m pip install --disable-pip-version-check "$MOLECULE_PIN"
      - name: Check isolated-run ownership and recovery contracts without backends
        run: make check-python
