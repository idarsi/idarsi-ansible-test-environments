name: Build execution environments

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ansible-min, ansible-current, ansible-next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Builder
        run: python -m pip install --disable-pip-version-check ansible-builder==3.1.1
      - name: Build and smoke-test image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
        run: scripts/build "${{ matrix.environment }}"
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable and convenience tags
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
        run: |
          case "${{ matrix.environment }}" in
            ansible-min) core_version=$(awk '/^  min:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
            ansible-current) core_version=$(awk '/^  current:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
            ansible-next) core_version=$(awk '/^  next:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
          esac
          test -n "$core_version"
          podman tag "$IMAGE" "ghcr.io/${{ github.repository_owner }}/ansible-test:$core_version"
          podman push "$IMAGE"
          podman push "ghcr.io/${{ github.repository_owner }}/ansible-test:$core_version"
