name: Build execution environments

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ansible-min, ansible-current, ansible-next]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Builder
        run: python -m pip install --disable-pip-version-check "ansible-builder==$(awk -F'\"' '/^ansible_builder:/{print $2}' versions.yml)"
      - name: Build and smoke-test image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
        run: scripts/build "${{ matrix.environment }}"
      - name: Export image for scanning
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
        run: podman save --output image.tar "$IMAGE"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Check image artifact integrity
        run: sha256sum image.tar > image.tar.sha256 && sha256sum --check image.tar.sha256
      - name: Export scanned image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.environment }}
          path: |
            image.tar
            image.tar.sha256

  publish:
    name: Publish ${{ matrix.environment }}
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        environment: [ansible-min, ansible-current, ansible-next]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a semantic version tag
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.environment }}
      - name: Load image
        run: sha256sum --check image.tar.sha256 && podman load --input image.tar
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and convenience tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-test:${{ matrix.environment }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "${{ matrix.environment }}" in
            ansible-min) core_version=$(awk '/^  min:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
            ansible-current) core_version=$(awk '/^  current:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
            ansible-next) core_version=$(awk '/^  next:/{gsub(/[\"]/, "", $2); print $2}' versions.yml) ;;
          esac
          test -n "$core_version"
          podman tag "$IMAGE" "ghcr.io/${{ github.repository_owner }}/ansible-test:$core_version"
          podman push "$IMAGE"
          podman push "ghcr.io/${{ github.repository_owner }}/ansible-test:$core_version"
