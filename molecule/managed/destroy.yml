---
- name: "Defer identity-owned resource removal to the isolated-run supervisor"
  hosts: "localhost"
  connection: "local"
  gather_facts: false
  become: false
  tasks:
    - name: "Require the managed run supervisor"
      ansible.builtin.assert:
        that:
          - lookup('env', 'IDARSI_RUN_ID') | length > 0
    - name: "Clear instance mapping without deleting resources inside the worker session"
      ansible.builtin.command:
        argv:
          - "{{ lookup('env', 'IDARSI_TEST_ENVIRONMENT') }}/scripts/test-run"
          - "_lifecycle"
          - "destroy"
          - "{{ lookup('env', 'IDARSI_RUN_ID') }}"
      changed_when: true
