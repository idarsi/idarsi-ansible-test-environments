---
- name: "Destroy the bound direct generation or defer to its supervisor"
  hosts: "localhost"
  connection: "local"
  gather_facts: false
  become: false
  tasks:
    - name: "Require the versioned shared lifecycle helper"
      ansible.builtin.assert:
        that:
          - lookup('env', 'IDARSI_TEST_ENVIRONMENT') | length > 0
    - name: "Remove owned direct resources or clear supervised mapping"
      ansible.builtin.command:
        argv:
          - "{{ lookup('env', 'IDARSI_TEST_ENVIRONMENT') }}/scripts/scenario-context"
          - "destroy"
          - "--backend"
          - "{{ lookup('env', 'IDARSI_MOLECULE_BACKEND') }}"
          - "--scenario"
          - "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}"
          - "--role"
          - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      changed_when: true
