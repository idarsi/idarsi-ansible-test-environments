---
scenario:
  name: kvm-smoke-fedora44

driver:
  name: default
  options:
    managed: true

ansible:
  playbooks:
    create: "${IDARSI_TEST_ENVIRONMENT}/molecule/kvm/create.yml"
    destroy: "${IDARSI_TEST_ENVIRONMENT}/molecule/kvm/destroy.yml"
    converge: "${IDARSI_TEST_ENVIRONMENT}/molecule/kvm-smoke/converge.yml"

platforms:
  - name: fedora44
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE_FEDORA44}"
    kickstart: ../../examples/molecule-kvm/fedora-44.ks.tmpl
    memory_mb: 4096
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 7200
    ssh_user: molecule

provisioner:
  name: ansible

verifier:
  name: ansible
